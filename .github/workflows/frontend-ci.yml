name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Install dependencies
        working-directory: frontend/swayp
        run: flutter pub get

      - name: Analyze
        working-directory: frontend/swayp
        run: flutter analyze

      - name: Run tests
        working-directory: frontend/swayp
        run: flutter test

      - name: Build debug APK
        working-directory: frontend/swayp
        run: flutter build apk --debug
